<tei-text data-xmlns="http://www.tei-c.org/ns/1.0" xml:id="tl" id="tl" data-origname="text"><tei-body data-origname="body"><tei-div data-origname="div"><tei-pb facs="#f005" data-origname="pb" data-empty=""></tei-pb>
<tei-div ana="#paintbrush #tracing #cambric #paper #crimson_fabric" data-origname="div">
<tei-ab data-origname="ab">
<tei-lb data-origname="lb" data-empty=""></tei-lb>for you to use with the <tei-seg ana="#paintbrush" data-origname="seg">paintbrush</tei-seg>, to
<tei-lb data-origname="lb" data-empty=""></tei-lb><tei-seg ana="#tracing" data-origname="seg">draw</tei-seg> with, on <tei-seg ana="#cambric" data-origname="seg">cambric</tei-seg>, and on <tei-seg ana="#paper" data-origname="seg">paper</tei-seg>.
<tei-lb data-origname="lb" data-empty=""></tei-lb>All the little pieces of <tei-seg ana="#crimson_fabric" data-origname="seg">crimson fabric</tei-seg>, which the
<tei-lb data-origname="lb" data-empty=""></tei-lb>tailors throw aside, they are good for that. It is not
<tei-lb data-origname="lb" data-empty=""></tei-lb>necessary to have large pieces.
</tei-ab>
</tei-div>

</tei-div></tei-body></tei-text>
