<tei-text data-xmlns="http://www.tei-c.org/ns/1.0" xml:id="tl" id="tl" data-origname="text"><tei-body data-origname="body"><tei-div data-origname="div"><tei-pb facs="#f088" data-origname="pb" data-empty=""></tei-pb>
<tei-div ana="#pattern #bouquet #wool #cutting #branch" data-origname="div">
<tei-ab data-origname="ab">
<tei-lb data-origname="lb" data-empty=""></tei-lb><tei-seg ana="#pattern" data-origname="seg">pattern</tei-seg>
<tei-lb data-origname="lb" data-empty=""></tei-lb>IHS
<tei-lb data-origname="lb" data-empty=""></tei-lb><tei-seg ana="#bouquet" data-origname="seg">bouquet</tei-seg> for 
<tei-lb data-origname="lb" data-empty=""></tei-lb>putting over
<tei-lb data-origname="lb" data-empty=""></tei-lb>hearts, which are 
<tei-lb data-origname="lb" data-empty=""></tei-lb>filled with
<tei-lb data-origname="lb" data-empty=""></tei-lb><tei-seg ana="#wool" data-origname="seg">wool</tei-seg>, one needs
<tei-lb data-origname="lb" data-empty=""></tei-lb>to <tei-seg ana="#cutting" data-origname="seg">cut</tei-seg> each
<tei-lb data-origname="lb" data-empty=""></tei-lb><tei-seg ana="#bouquet" data-origname="seg">bouquet</tei-seg>, holding all of it
<tei-lb data-origname="lb" data-empty=""></tei-lb>in its <tei-seg ana="#branch" data-origname="seg">branch</tei-seg>, without
<tei-lb data-origname="lb" data-empty=""></tei-lb>separating anything, one from the other.
</tei-ab>
