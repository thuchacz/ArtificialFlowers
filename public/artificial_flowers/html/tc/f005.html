<tei-lb data-origname="lb" data-empty=""></tei-lb>a voūs en serūirre aūec le <tei-seg ana="#paintbrush" data-origname="seg">paincaūx</tei-seg>, poūr

<tei-lb data-origname="lb" data-empty=""></tei-lb>nesecaire d’aūoir des grand morcaūx, ~~
