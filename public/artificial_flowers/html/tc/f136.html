<tei-text data-xmlns="http://www.tei-c.org/ns/1.0" xml:id="tc" id="tc" data-origname="text"><tei-body data-origname="body"><tei-div data-origname="div"><tei-pb facs="#f136" data-origname="pb" data-empty=""></tei-pb>
<tei-div ana="#vierendeel #alum #tartar" data-origname="div">
<tei-ab data-origname="ab">
<tei-lb data-origname="lb" data-empty=""></tei-lb>nichte belieft
<tei-lb data-origname="lb" data-empty=""></tei-lb>de goũtheijt te hebbe
<tei-lb data-origname="lb" data-empty=""></tei-lb>van hier te tiecken
<tei-lb data-origname="lb" data-empty=""></tei-lb>tot een <tei-seg ana="#vierendeel" data-origname="seg">vierendeel</tei-seg>
<tei-lb data-origname="lb" data-empty=""></tei-lb>van het gheen dat
<tei-lb data-origname="lb" data-empty=""></tei-lb>het van nooet is
<tei-lb data-origname="lb" data-empty=""></tei-lb>oũ veel
<tei-lb data-origname="lb" data-empty=""></tei-lb><tei-seg ana="#alum" data-origname="seg">root olũn</tei-seg>
<tei-lb data-origname="lb" data-empty=""></tei-lb>van Co
<tei-lb data-origname="lb" data-empty=""></tei-lb>en van <tei-seg ana="#tartar" data-origname="seg">wijnsten</tei-seg>
<tei-lb data-origname="lb" data-empty=""></tei-lb>ick sal vl: dancbar
<tei-lb data-origname="lb" data-empty=""></tei-lb>sijn
</tei-ab>
</tei-div>

</tei-div></tei-body></tei-text>
